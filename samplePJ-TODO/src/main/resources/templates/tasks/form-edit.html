<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/form-edit.css}">
<title>タスク編集</title>


<body>
	<div class="container">
		<h1>タスク編集</h1>
		<form th:action="@{/tasks/edit}" method="post">
			<input type="hidden" name="id" th:value="${task.id}">
			<div class="form-group">

				<label>タイトル</label><br>
				<input type="text" name="title" th:value="${task.title}">
			</div><br>
			<div class="form-group">
				<label>内容</label><br>
				<!--　↓これは複数行入力可能（inputは１行だけ入力-->
				<textarea name="content" rows="2" th:text="${task.content}"></textarea>
			</div><br>
			<div class="form-group">
				<label>登録者</label><br>
				<input type="text" name="name" th:value="${task.name}">
			</div><br>
			<div class="form-group">
				<label>開始日</label><br>
				<input type="date" name="startDate" th:value="${task.startDate}">
			</div><br>
			<div class="form-group">
				<label>終了日</label><br>
				<input type="date" name="endDate" th:value="${task.endDate}">
			</div>
			<div class="button-area">
				<!-- formをcontrollerに送るやつsubmit-->
				<button type="submit" class="btn-update">完了</button><br>
				<a th:href="@{/tasks}" class="btn-delete">←キャンセル</a>
			</div>
	</div>
	</form>
</body>
