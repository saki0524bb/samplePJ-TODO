<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<title>タスク新規作成</title>

<style>
	body {
		/*<!--ブラウザが最初から持ってる余白を消している-->*/
		margin: 0;
		/*		<!--文字の種類、ゴシックとか-->*/
		font-family: "Yu Gothic", "Meiryo", sans-serif;
		/*	<!--画面全体の背景色-->*/
		background-color: white;
	}


	/*	<!--表全体-->*/
	table {
		/*<!--containerの横幅いっぱい-->*/
		width: 100%;
		/*	<!--表の線をくっつける-->*/
		border-collapse: collapse;
		/*<!--表全体の背景を白にする-->*/
		background-color: white;
		/*<!--表の中の文字サイズ-->*/
		font-size: 14px;
	}

	.container {
		width: 80%;
		margin: 50px auto;
		background: white;
		padding: 20px;
		border-radius: 8px;
	}



	form {
		width: 100%;
		/* ← containerに合わせる */
		margin: 0;
		/* ←中央寄せやめる */
	}

	.form-group {
		/*下の余白*/
		margin-bottom: 15px;
	}

	form-group label {
		width: 100px;
		font-weight: bold;
	}

	.form-group input,
	.form-group textarea {
		width: 100%;
		padding: 8px;
		border: 1px solid #ccc;
		border-radius: 4px;
		box-sizing: border-box;
		resize: none;
	}

	.button-area {
		display: flex;
		gap: 10px;
	}

	.btn-update {
		color: white;
		background-color: blue;
		/*丸くする、角をとる*/
		border-radius: 8px;
		padding: 8px 16px;
		cursor: pointer;
		text-decoration: none;
	}

	.btn-delete {
		color: white;
		background-color: gray;
		border-radius: 8px;
		padding: 8px 16px;
		cursor: pointer;
		text-decoration: none;
	}

	input,
	textarea {
		font-family:  "Meiryo", sans-serif;
		font-size: 16px;
	}
	
</style>

<body>
	<div class="container">
		<h1>タスク新規作成</h1>
		<!--ifなので、エラーのときだけ表示-->
		<p th:if="${error}" th:text="${error}" style="color: red;"></p>
		<form th:action="@{/tasks/new}" method="post">



			<div class="form-group">
				<label>タイトル</label><br>
				<input type="text" name="title">
			</div><br>
			<div class="form-group">
				<label>内容</label><br>
				<!--　↓これは複数行入力可能（inputは１行だけ入力-->
				<textarea name="content" rows="2"></textarea>
			</div><br>
			<div class="form-group">
				<label>登録者</label><br>
				<input type="text" name="name">
			</div><br>
			<div class="form-group">
				<label>開始日</label><br>
				<input type="date" name="startDate">
			</div><br>
			<div class="form-group">
				<label>終了日</label><br>
				<input type="date" name="endDate">
			</div>
			<div class="button-area">
				<!-- formをcontrollerに送るやつ-->
				<button type="submit" class="btn-update">完了</button><br>
				<a th:href="@{/tasks}" class="btn-delete">←キャンセル</a>
			</div>
	</div>
	</form>
</body>
